<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordbog</title>

<!-- Home-screen app metadata -->
<meta name="application-name" content="Ordbog">
<meta name="apple-mobile-web-app-title" content="Ordbog">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Matches --bg in the app so the status bar blends seamlessly -->
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171D" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #F2F4F6;
  }
  @media (prefers-color-scheme: dark) {
    html, body {
      background: #12171D;
    }
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwR6R8Y68_AmJTpAjSaWVbcFlEyY9nqJ7cOVTSEXLAqYaHR_jTPTx97yuq1YoYTmBs/exec" 
    title="Ordbog"
    allow="microphone">
  </iframe>
</body>
</html>

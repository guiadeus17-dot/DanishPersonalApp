<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Danish Tracker</title>
  <link rel="manifest" href="manifest.json">
  <!-- The phone's status and navigation bars follow light/dark mode, matching the app's own background -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12171D">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F2F4F6;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #12171D; }
    }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;  /* older browsers */
      height: 100dvh; /* follows the real visible height (keyboard, browser bars) */
      border: none;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbw64qzpTXmX3Gsf0C5C9WDLWRRnRir6QJORf2Lf4wcH_a8Xp2sNUQy_vDDMLSec9pM/exec" allow="autoplay; camera; microphone"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danish Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c8102e">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #12151e;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #c8102e;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }

    // Wait 10 seconds (10000ms) to give you plenty of time to tap "Add to Home screen"
    setTimeout(() => {
      window.location.href = "https://script.google.com/macros/s/AKfycbw64qzpTXmX3Gsf0C5C9WDLWRRnRir6QJORf2Lf4wcH_a8Xp2sNUQy_vDDMLSec9pM/exec";
    }, 10000);
  </script>
</head>
<body>
  <h2>Danish Tracker</h2>
  <p>Opening app in 10 seconds...</p>
  <a class="btn" href="https://script.google.com/macros/s/AKfycbw64qzpTXmX3Gsf0C5C9WDLWRRnRir6QJORf2Lf4wcH_a8Xp2sNUQy_vDDMLSec9pM/exec">Open Immediately</a>
</body>
</html>
